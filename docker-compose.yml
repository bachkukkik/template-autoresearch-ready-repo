# Docker Compose — Agentic Ready Repo Template
services:
  # ─── Python microservice ────────────────────────────────────
  service:
    build: ./service
    environment:
      # Passthrough defaults — dev runs auth-disabled out of the box;
      # override via the host environment (e.g. `AUTH_DISABLED=0 AUTH_BEARER_TOKEN=... docker compose up -d`).
      AUTH_DISABLED: ${AUTH_DISABLED:-1}
      AUTH_BEARER_TOKEN: ${AUTH_BEARER_TOKEN:-}
      RESEARCH_JOBS_DB: ${RESEARCH_JOBS_DB:-data/jobs.db}
      RESEARCH_RUN_TIMEOUT: ${RESEARCH_RUN_TIMEOUT:-30}
      RESEARCH_MAX_CONCURRENT_JOBS: ${RESEARCH_MAX_CONCURRENT_JOBS:-4}
      RESEARCH_WORKSPACES_DIR: ${RESEARCH_WORKSPACES_DIR:-data/workspaces}
      RESEARCH_CORPUS_ROOT: ${RESEARCH_CORPUS_ROOT:-/kb-raw}
    volumes:
      # Read-only corpus mount — serves research topics from the repo's
      # kb/raw/transcripts out of the box.
      - ./kb/raw:/kb-raw:ro
      # Read-only canonical-contract mount — the service executes contract/
      # directly (single source of truth; no vendored copy in the image).
      - ./contract:/app/contract:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5