[project]
name = "autoresearch"
version = "0.1.0"
description = "The autoresearch loop: stdlib engine, canonical contract, REST + MCP service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=4.0.0,<5",
    "apscheduler>=3.10,<4",
    "pydantic>=2",
]

[project.scripts]
autoresearch = "autoresearch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# One distribution, two top-level packages: the engine (import `autoresearch`,
# sources in engine/autoresearch/) and the service (import `autoresearch_service`,
# sources in service/autoresearch_service/). Neither is a package named `src`, so
# both can ship from this one pyproject.
[tool.setuptools]
packages = ["autoresearch", "autoresearch_service"]

[tool.setuptools.package-dir]
autoresearch = "engine/autoresearch"
autoresearch_service = "service/autoresearch_service"
